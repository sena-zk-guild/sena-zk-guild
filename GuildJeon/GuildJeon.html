<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>길드전</title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .rectangle-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; /* 직사각형 사이의 간격 */
            width: 90%; /* 화면 전체 너비의 90% 사용 */
            flex-wrap: wrap; /* 좁은 화면에서는 자동 줄바꿈 */
        }
        .red-rectangle {
            flex: 1; /* 5개의 직사각형이 가로 공간을 균등하게 채움 */
            min-width: 120px; /* 최소 너비 */
            height: 200px; /* 직사각형 높이 */
            background-color: black; /* 내부 검은색 */
            border: 3px solid red; /* 빨간색 테두리 */
            box-sizing: border-box;
            display: flex; /* 내부 텍스트 정렬 */
            justify-content: center; /* 가로 가운데 정렬 */
            align-items: center; /* 세로 가운데 정렬 */
            color: white; /* 하얀색 글씨 */
            font-size: 24px; /* 글씨 크기 */
            font-weight: bold; /* 글씨 굵기 */
        }
    </style>
</head>
<body>
    <div class="rectangle-container">
        <div class="red-rectangle">1팀</div>
        <div class="red-rectangle">2팀</div>
        <div class="red-rectangle">3팀</div>
        <div class="red-rectangle">4팀</div>
        <div class="red-rectangle">5팀</div>
    </div>
</body>
</html>
