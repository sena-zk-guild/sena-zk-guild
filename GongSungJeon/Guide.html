<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공성전 세부 공략</title>
    <style>
        /* 부드러운 스크롤 효과 */
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: black; /* 검은색 배경 */
            color: white; /* 기본 글자색을 하얀색으로 설정 */
            margin: 0;
            padding: 50px 20px; /* 위아래 50px, 좌우 20px의 여백 */
            
            /* 내용이 적어도 화면 높이를 꽉 채우고, 내용이 많아지면 알아서 아래로 늘어납니다 */
            min-height: 100vh; 
            
            display: flex;
            flex-direction: column;
            align-items: center; /* 내용들을 가운데 정렬 */
        }

        /* 왼쪽 사이드바(뒤로 가기) 디자인 */
        .sidebar-back {
            position: fixed; 
            left: 0;
            top: 0;
            bottom: 0; 
            width: 60px; 
            background-color: #a0a0a0; 
            
            display: flex;
            justify-content: center;
            align-items: center;
            
            z-index: 100; 
            opacity: 0.35; 
            transition: opacity 0.3s ease, background-color 0.3s ease; 
        }

        .sidebar-back:hover {
            opacity: 1; 
            background-color: #909090; 
        }

        /* 스크롤(슬라이드)이 잘 되는지 확인하기 위한 임시 상자 */
        .test-box {
            height: 1500px; /* 세로로 아주 긴 길이 */
            width: 80%;
            border: 2px dashed gray; /* 회색 점선 테두리 */
            display: flex;
            justify-content: center;
            align-items: center;
            color: gray;
        }
    </style>
</head>
<body>
    <!-- 이전 공성전 화면으로 돌아가는 버튼 -->
    <a href="GongSungJeon.html" class="back-btn">← 이전 화면으로 돌아가기</a>

    <h1>세부 공략 내용</h1>
    <p>여기에 글이나 사진을 추가하면 됩니다. 내용이 늘어나면 화면은 자연스럽게 아래로 길어집니다.</p>

    <!-- 스크롤 확인용 임시 상자 (확인 후 이 div 부분은 지우시고 실제 내용을 적으시면 됩니다) -->
    <div class="test-box">
        스크롤 테스트 공간입니다. 마우스 휠을 굴려 아래로 내려보세요!
    </div>
</body>
</html>
