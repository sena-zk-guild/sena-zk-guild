<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공성전 요일별 안내</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            color: white; 
        }

        /* 7개의 상자를 묶어주는 컨테이너 */
        .days-container {
            display: flex;
            gap: 10px; 
            width: 85%; 
            height: 50vh; 
            margin-left: 50px; /* 사이드바 공간만큼 오른쪽으로 밀어줌 */
        }

        /* 개별 요일 상자의 디자인 */
        .day-box {
            flex: 1;
            border: 2px solid red; 
            
            display: flex;
            justify-content: center;
            align-items: center; 
            
            font-size: 32px;
            font-weight: bold;
            color: white;
        
            background-color: black;
            background-size: cover; 
            background-repeat: no-repeat; 
        
            text-shadow: 
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000;
        }

        /* --- 왼쪽 사이드바(뒤로 가기) 디자인 (희미하게 보이기 설정 적용) --- */
        .sidebar-back {
            position: fixed; 
            left: 0;
            top: 0;
            bottom: 0; 
            width: 60px; 
            background-color: #a0a0a0; 
            
            display: flex;
            justify-content: center;
            align-items: center;
            
            z-index: 100; 
            
            /* 평소에는 투명도를 낮춰 희미하게 보임 (0.2 ~ 0.3 사이로 조절 가능) */
            opacity: 0.35; 
            
            /* 마우스가 올라갔을 때 투명도가 부드럽게 변하는 시간 설정 */
            transition: opacity 0.3s ease, background-color 0.3s ease; 
        }

        /* 마우스를 올렸을 때 완전히 선명하고 밝아지도록 설정 */
        .sidebar-back:hover {
            opacity: 1; 
            background-color: #909090; /* 마우스 올렸을 때 배경색 살짝 조절 */
        }
    </style>
</head>
<body>
    <!-- 왼쪽 회색 사이드바와 하얀색 화살표 -->
    <a href="../index.html" class="sidebar-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14L4 9l5-5"/>
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
        </svg>
    </a>

    <!-- 7개의 빨간 테두리 상자 -->
    <div class="days-container">
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJrudy.png'); background-position: 50% 20%;">월요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJeileene.png'); background-position: 50% 30%;">화요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJrachel.png'); background-position: 60% 40%;">수요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJdellons.png'); background-position: 50% 50%;">목요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJjave.png'); background-position: 40% 50%;">금요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJspike.png'); background-position: 50% 60%;">토요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJchris.png'); background-position: 50% 80%;">일요일</div>
    </div>
</body>
</html>
