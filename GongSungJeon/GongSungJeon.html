<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공성전 요일별 안내</title>
    <style>
        /* --- 기존 스타일 아래에 이 코드를 추가해 주세요 --- */

        @media (max-width: 768px) {
            body {
                height: auto;
                padding: 20px 15px;
                box-sizing: border-box;
            }

            /* 모바일에서는 왼쪽 여백을 없애고 세로로 쌓기 */
            .days-container {
                flex-direction: column; 
                width: 100%;
                height: auto;
                margin-left: 0; 
                gap: 12px; /* 상자 사이 간격 */
            }

            /* 모바일에서 각 요일 상자의 크기 변경 */
            .day-box {
                width: 100%;
                height: 90px; /* 스마트폰에서 보기 좋은 높이로 설정 */
                font-size: 24px;
                background-size: cover !important; /* 이미지가 상자에 꽉 차도록 조절 */
                background-position: center !important;
            }

            /* 모바일에서 왼쪽 뒤로가기 버튼 크기 최적화 */
            .sidebar-back {
                width: 45px;
            }
            
            body {
                padding-left: 30px; /* 사이드바에 가리지 않도록 여백 추가 */
            }
        }
        
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            color: white; 
        }

        /* 7개의 상자를 묶어주는 컨테이너 */
        .days-container {
            display: flex;
            gap: 10px; 
            width: 85%; 
            height: 70vh; 
            margin-left: 50px; 
        }

        /* 개별 요일 상자의 디자인 */
        .day-box {
            flex: 1;
            border: 2px solid red; 
            
            /* 캐릭터 얼굴이 글씨 위에 오도록 글자를 아래로 내리는 코드 적용 */
            display: flex;
            justify-content: center;
            align-items: center; 
            
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-decoration: none; /* 링크 밑줄 제거 */
        
            background-color: black;
            background-repeat: no-repeat; 
        
            text-shadow: 
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000;
        }

        /* 왼쪽 사이드바(뒤로 가기) 디자인 */
        .sidebar-back {
            position: fixed; 
            left: 0;
            top: 0;
            bottom: 0; 
            width: 60px; 
            background-color: #a0a0a0; 
            
            display: flex;
            justify-content: center;
            align-items: center;
            
            z-index: 100; 
            opacity: 0.35; 
            transition: opacity 0.3s ease, background-color 0.3s ease; 
        }

        .sidebar-back:hover {
            opacity: 1; 
            background-color: #909090; 
        }
    </style>
</head>
<body>
    <!-- 왼쪽 회색 사이드바와 하얀색 화살표 -->
    <a href="../index.html" class="sidebar-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14L4 9l5-5"/>
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
        </svg>
    </a>

    <!-- 7개의 빨간 테두리 상자 (href 링크 주소 뒤에 #id 추가) -->
    <div class="days-container">
        <a href="Guide.html#mon" class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJrudy.png'); background-size: 240%; background-position: 50% 15%;">월요일</a>
        <a href="Guide.html#tue" class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJeileene.png'); background-size: 230%; background-position: 50% 10%;">화요일</a>
        <a href="Guide.html#wed" class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJrachel.png'); background-size: 250%; background-position: 40% 50%;">수요일</a>
        <a href="Guide.html#thu" class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJdellons.png'); background-size: 300%; background-position: 50% 70%;">목요일</a>
        <a href="Guide.html#fri" class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJjave.png'); background-size: 220%; background-position: 50% 20%;">금요일</a>
        <a href="Guide.html#sat" class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJspike.png'); background-size: 240%; background-position: 50% 20%;">토요일</a>
        <a href="Guide.html#sun" class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJchris.png'); background-size: 230%; background-position: 50% 40%;">일요일</a>
    </div>
</body>
</html>
