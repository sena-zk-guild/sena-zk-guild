<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공성전 요일별 안내</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            color: white; 
        }

        /* 7개의 상자를 묶어주는 컨테이너 */
        .days-container {
            display: flex;
            gap: 10px; 
            width: 85%; 
            height: 50vh; 
            /* 사이드바가 왼쪽 공간을 차지하므로 상자들을 살짝 오른쪽으로 밀어 중앙을 맞춥니다 */
            margin-left: 50px; 
        }

        /* 개별 요일 상자의 디자인 */
        .day-box {
            flex: 1;
            border: 2px solid red; 
            
            display: flex;
            justify-content: center;
            align-items: center; 
            
            font-size: 32px;
            font-weight: bold;
            color: white;
        
            background-color: black;
            background-size: cover; 
            background-repeat: no-repeat; 
        
            text-shadow: 
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000;
        }

        /* --- 새로 추가된 왼쪽 사이드바(뒤로 가기) 디자인 --- */
        .sidebar-back {
            position: fixed; /* 화면 왼쪽에 고정 */
            left: 0;
            top: 0;
            bottom: 0; /* 위아래로 꽉 차게 설정 */
            width: 60px; /* 회색 기둥의 두께 */
            background-color: #a0a0a0; /* 사진과 비슷한 회색 배경 */
            
            /* 화살표를 기둥 정중앙에 배치 */
            display: flex;
            justify-content: center;
            align-items: center;
            
            z-index: 100; /* 다른 상자들보다 무조건 맨 위에 보이게 설정 */
            transition: background-color 0.2s; /* 마우스 올렸을 때 부드러운 색상 변화 */
        }

        /* 사이드바에 마우스를 올렸을 때 색상이 살짝 진해지는 효과 */
        .sidebar-back:hover {
            background-color: #7a7a7a; 
        }
    </style>
</head>
<body>
    <!-- 왼쪽 회색 사이드바와 하얀색 둥근 화살표 (SVG 기호 사용) -->
    <a href="index.html" class="sidebar-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14L4 9l5-5"/>
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
        </svg>
    </a>

    <!-- 7개의 빨간 테두리 상자 -->
    <div class="days-container">
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GongSungJeon/GSJrudy.png'); background-position: 50% 20%;">월요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GongSungJeon/GSJeileene.png'); background-position: 50% 30%;">화요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GongSungJeon/GSJrachel.png'); background-position: 60% 40%;">수요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GongSungJeon/GSJdellons.png'); background-position: 50% 50%;">목요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GongSungJeon/GSJjave.png'); background-position: 40% 50%;">금요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GongSungJeon/GSJspike.png'); background-position: 50% 60%;">토요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GongSungJeon/GSJchris.png'); background-position: 50% 80%;">일요일</div>
    </div>
</body>
</html>
