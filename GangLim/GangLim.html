<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>강림 원정대</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            color: white; 
        }

        /* 전체 상자들을 묶어주는 투명한 뼈대 */
        .boxes-container {
            display: flex;
            gap: 10px; 
            width: 85%; 
            height: 70vh; 
            margin-left: 50px; 
        }

        /* 개별 영웅 상자의 디자인 */
        .ganglim-box {
            flex: 1;
            border: 2px solid red; 
            
            display: flex;
            justify-content: center;
            align-items: center; 
            
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        
            background-color: black;
            background-repeat: no-repeat; 
            background-size: cover;
            background-position: center;
        
            text-shadow: 
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000;
        }

        /* 왼쪽 사이드바(뒤로 가기) 디자인 */
        .sidebar-back {
            position: fixed; 
            left: 0;
            top: 0;
            bottom: 0; 
            width: 60px; 
            background-color: #a0a0a0; 
            
            display: flex;
            justify-content: center;
            align-items: center;
            
            z-index: 100; 
            opacity: 0.35; 
            transition: opacity 0.3s ease, background-color 0.3s ease; 
        }

        .sidebar-back:hover {
            opacity: 1; 
            background-color: #909090; 
        }
    </style>
</head>
<body>
    <!-- 왼쪽 사이드바 -->
    <a href="../index.html" class="sidebar-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14L4 9l5-5"/>
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
        </svg>
    </a>

    <!-- 5개의 구역 (파괴신을 제외한 4곳에 배경 이미지 적용) -->
    <div class="boxes-container">
        <div class="ganglim-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GLteo.png'); background-size: 170%; background-position: 50% 15%;">태오</div>
        <div class="ganglim-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GLkyle.png'); background-size: 200%; background-position: 50% 15%;">카일</div>
        <div class="ganglim-box" style="flex: 2;">파괴신</div>
        <div class="ganglim-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GLyeonhee.png');">연희</div>
        <div class="ganglim-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GLkarma.png');">카르마</div>
    </div>
</body>
</html>
