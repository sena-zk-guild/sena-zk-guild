<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 👇 모바일 화면 최적화를 위한 필수 뷰포트 태그 추가 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강림 원정대</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            color: white; 
        }

        /* 전체 상자들을 묶어주는 투명한 뼈대 */
        .boxes-container {
            display: flex;
            gap: 10px; 
            width: 85%; 
            height: 70vh; 
            margin-left: 50px; 
        }

        /* 개별 영웅 상자의 디자인 */
        .ganglim-box {
            flex: 1;
            border: 2px solid red; 
            
            display: flex;
            justify-content: center;
            align-items: center; 
            
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        
            background-color: black;
            background-repeat: no-repeat; 
            background-size: cover;
            background-position: center;
        
            text-shadow: 
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000;
        }

        /* 왼쪽 사이드바(뒤로 가기) 디자인 */
        .sidebar-back {
            position: fixed; 
            left: 0;
            top: 0;
            bottom: 0; 
            width: 60px; 
            background-color: #a0a0a0; 
            
            display: flex;
            justify-content: center;
            align-items: center;
            
            z-index: 100; 
            opacity: 0.35; 
            transition: opacity 0.3s ease, background-color 0.3s ease; 
        }

        .sidebar-back:hover {
            opacity: 1; 
            background-color: #909090; 
        }

        /* --- 📱 모바일 화면 전용 설정 (미디어 쿼리) --- */
        @media (max-width: 768px) {
            body {
                height: auto;
                padding: 20px 15px 20px 45px; /* 모바일에서 본문 여백 및 사이드바 공간 확보 */
                box-sizing: border-box;
            }

            .boxes-container {
                flex-direction: column; /* 모바일에서는 세로로 한 줄씩 쌓기 */
                width: 100%;
                height: auto;
                margin-left: 0;
                gap: 12px;
            }

            .ganglim-box {
                width: 100%;
                height: 110px; /* 모바일에서 각 영웅 상자의 높이 지정 */
                background-size: cover !important;
                background-position: center !important;
            }

            .sidebar-back {
                width: 40px; /* 모바일에서 사이드바 크기 최적화 */
            }
        }
    </style>
</head>
<body>
    <!-- 왼쪽 사이드바 -->
    <a href="../index.html" class="sidebar-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14L4 9l5-5"/>
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
        </svg>
    </a>

    <!-- 5개의 구역 -->
    <div class="boxes-container">
        <a href="Guide.html#teo" class="ganglim-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GLteo.png'); background-size: 240%; background-position: 50% 65%;">태오</a>
        <a href="Guide.html#kyle" class="ganglim-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GLkyle.png'); background-size: 310%; background-position: 50% 40%;">카일</a>
        <a href="Guide.html#destroyer" class="ganglim-box" style="flex: 2;">파괴신</a>
        <a href="Guide.html#yeonhee" class="ganglim-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GLyeonhee.png');">연희</a>
        <a href="Guide.html#karma" class="ganglim-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GLkarma.png');">카르마</a>
    </div>
</body>
</html>
