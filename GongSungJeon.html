<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공성전 요일별 안내</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            color: white; /* 기본 글씨 색상을 흰색으로 설정 */
        }

        /* 7개의 상자를 가로로 나란히 묶어주는 컨테이너 */
        .days-container {
            display: flex;
            gap: 10px; /* 상자 사이의 간격 */
            width: 95%; /* 모니터 가로 너비의 95%를 꽉 채워서 사용 */
            height: 60vh; /* 화면 세로 높이의 60% 크기로 큼직하게 설정 */
        }

        /* 개별 요일 상자의 디자인 */
        /* 기존 .day-box를 아래 코드로 덮어씁니다 */
        .day-box {
            flex: 1;
            border: 3px solid red;
            background-color: transparent;
            display: flex;
            /* 사진과 글씨를 위아래(세로)로 배치하는 핵심 코드 */
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            gap: 20px; /* 사진과 글씨 사이의 간격 */
        }
        
        /* 새로 추가: 상자 안에 들어가는 사진의 크기와 모양 설정 */
        .day-box img {
            width: 80%; /* 사진 너비를 상자 크기의 80%로 맞춤 */
            max-height: 60%; /* 사진이 상자 밖으로 삐져나가지 않게 제한 */
            object-fit: cover; /* 사진 비율이 찌그러지지 않게 유지 */
            border-radius: 15px; /* 사진 모서리를 둥글게 깎음 */
        }

        /* 돌아가기 버튼 디자인 */
        .back-link {
            color: #ff4444;
            font-size: 20px;
            text-decoration: none;
            margin-top: 40px; /* 상자들과의 간격 띄우기 */
        }
    </style>
</head>
<body>
    <!-- 7개의 빨간 테두리 상자 -->
    <div class="days-container">
        <div class="day-box">
            <img src="GSJrudy.png" alt="월요일 영웅">
            <span>월요일</span>
        </div>
        <div class="day-box">
            <img src="tue.png" alt="화요일 영웅">
            <span>화요일</span>
        </div>
        <div class="day-box">
            <img src="wed.png" alt="수요일 영웅">
            <span>수요일</span>
        </div>
        <div class="day-box">
            <img src="thu.png" alt="목요일 영웅">
            <span>목요일</span>
        </div>
        <div class="day-box">
            <img src="fri.png" alt="금요일 영웅">
            <span>금요일</span>
        </div>
        <div class="day-box">
            <img src="sat.png" alt="토요일 영웅">
            <span>토요일</span>
    </div>
    <div class="day-box">
        <img src="sun.png" alt="일요일 영웅">
        <span>일요일</span>
    </div>
</div>

    <!-- 이전 화면으로 돌아가기 위한 링크 -->
    <a href="index.html" class="back-link">메인 화면으로 돌아가기</a>
</body>
</html>
