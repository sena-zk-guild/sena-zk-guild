<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공성전 요일별 안내</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh; /* 화면을 꽉 채우고 스크롤 없이 고정 */
            display: flex;
            flex-direction: column; 
            justify-content: center; /* 세로 기준 정중앙 배치 */
            align-items: center; /* 가로 기준 정중앙 배치 */
            color: white; 
        }

        /* 7개의 상자를 묶어주는 컨테이너 */
        .days-container {
            display: flex;
            gap: 10px; 
            width: 85%; /* 사진과 비슷한 비율로 가로 너비 조절 */
            height: 50vh; /* 사진과 비슷한 비율로 세로 높이 조절 */
        }

        /* 개별 요일 상자의 디자인 */
        .day-box {
            flex: 1;
            border: 2px solid red;
            display: flex;
            justify-content: center;
            align-items: center; 
            font-size: 32px;
            font-weight: bold;
            color: white;
        
            /* --- 여기서부터 배경 이미지 관련 설정 --- */
            background-color: black;
            background-size: cover; /* 사진을 상자 크기에 여백 없이 꽉 맞춥니다 */
            background-position: center; /* 사진의 중앙을 기준으로 보여줍니다 */
            background-repeat: no-repeat;
            
            /* 사진 위에서 글씨가 뚜렷하게 보이도록 검은 테두리 추가 */
            text-shadow: 
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000;
        }

        /* 돌아가기 버튼 디자인 */
        .back-link {
            color: red; /* 사진과 동일한 붉은색 텍스트 */
            font-size: 16px;
            text-decoration: none;
            margin-top: 40px; /* 상자와의 간격 */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- 7개의 빨간 테두리 상자 -->
   <div class="days-container">
        <!-- url('...') 안에 깃허브에 올리신 실제 사진 파일명을 정확히 적어주세요 -->
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJrudy.png');">월요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJeileene.png');">화요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('GSJrachel.png');">수요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('thu.png');">목요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('fri.png');">금요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('sat.png');">토요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('sun.png');">일요일</div>
    </div>
    <!-- 이전 화면으로 돌아가기 위한 링크 -->
    <a href="index.html" class="back-link">메인 화면으로 돌아가기</a>
</body>
</html>
