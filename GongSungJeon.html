<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공성전 요일별 안내</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            color: white; /* 기본 글씨 색상을 흰색으로 설정 */
        }

        /* 7개의 상자를 가로로 나란히 묶어주는 컨테이너 */
        .days-container {
            display: flex;
            gap: 10px; /* 상자 사이의 간격 */
            width: 95%; /* 모니터 가로 너비의 95%를 꽉 채워서 사용 */
            height: 60vh; /* 화면 세로 높이의 60% 크기로 큼직하게 설정 */
        }

        /* 개별 요일 상자의 디자인 */
        .day-box {
            flex: 1;
            border: 3px solid red;
            
            /* 글씨 위치 정렬 (올려주신 사진처럼 아래쪽에 배치) */
            display: flex;
            justify-content: center;
            align-items: center; /* 글씨를 바닥으로 내립니다 */
            
            font-size: 40px;
            font-weight: bold;
            color: white;
        
            /* --- 여기서부터 배경 이미지 관련 핵심 설정 --- */
            background-color: black;
            background-size: 1000%; /* 이미지가 잘리지 않고 쏙 들어가게 (여백 없이 꽉 채우려면 cover) */
            background-position: 64% 15%; /* 이미지를 정중앙에 배치 */
            background-repeat: no-repeat; /* 이미지가 바둑판처럼 반복되는 것 방지 */
        
            /* 배경 사진과 글씨가 겹쳐도 잘 보이도록 글씨에 굵은 검은색 테두리 추가 */
            text-shadow: 
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000;
        }

        /* 돌아가기 버튼 디자인 */
        .back-link {
            color: #ff4444;
            font-size: 20px;
            text-decoration: none;
            margin-top: 40px; /* 상자들과의 간격 띄우기 */
        }
    </style>
</head>
<body>
    <!-- 7개의 빨간 테두리 상자 -->
    <div class="days-container">
        <!-- 0.5 숫자를 조절하여 투명도를 결정합니다. (0은 투명, 1은 완전 검은색) -->
        <div class="day-box" style="background-image: linear-gradient(rgba(191, 238, 255, 0.5), rgba(191, 238, 255, 0.5)), url('GSJrudy.png');">월요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('tue.png');">화요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('wed.png');">수요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('thu.png');">목요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('fri.png');">금요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('sat.png');">토요일</div>
        <div class="day-box" style="background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('sun.png');">일요일</div>
    </div>

    <!-- 이전 화면으로 돌아가기 위한 링크 -->
    <a href="index.html" class="back-link">메인 화면으로 돌아가기</a>
</body>
</html>
